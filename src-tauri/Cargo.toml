[package]
name = "pipeline-supervisor"
version = "0.1.0"
description = "Always-on-top pipeline supervisor overlay"
authors = ["Pipeline Supervisor contributors"]
edition = "2021"

[lib]
name = "pipeline_supervisor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
